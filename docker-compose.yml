services:
  chrome-novnc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chrome-novnc
    network_mode: host
    shm_size: "1gb"
    env_file:
      - .env
    environment:
      DISPLAY: ":0"
    volumes:
      - /tmp/chromium-config:/config
    restart: unless-stopped
